version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - gocyclo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
  settings:
    errcheck:
      # Ignore errors on cleanup/best-effort operations.
      exclude-functions:
        - os.Remove
        - os.Chmod
        - (*os.File).Close
    gocyclo:
      min-complexity: 30
    gocritic:
      disabled-tags:
        - style
        - experimental
        - opinionated
    gosec:
      excludes:
        # CLI app legitimately reads files from computed paths.
        - G304
        # CLI app legitimately launches a user-configured editor.
        - G204
        # Overlaps with errcheck. Cleanup errors are intentionally ignored.
        - G104
        # Path traversal via taint: temp files are created by us, not user input.
        - G703
        # Command injection via taint: editor is validated with LookPath.
        - G702
        # Directories: allow 0755 for compatibility.
        - G301
        # Files: allow 0644 for config files.
        - G306
    revive:
      # Production files stay under 800 lines.
      # Test files and generated files are exempt via the exclusions block below.
      rules:
        - name: file-length-limit
          arguments:
            - max: 800
              skipComments: false
              skipBlankLines: false
    usetesting:
      # Prefer t.Context() over context.Background()/context.TODO() in tests
      # (Go 1.24+). Only flagged where a *testing.T is in scope. Helpers
      # without a t keep context.Background().
      context-background: true
      context-todo: true
  exclusions:
    paths:
      - vendor
    rules:
      # Revive has no other rules enabled, so excluding it here equals
      # excluding just the file-length-limit rule.
      - path: '_test\.go$'
        linters:
          - revive
      - path: '_gen\.go$'
        linters:
          - revive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
